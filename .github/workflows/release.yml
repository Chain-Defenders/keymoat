name: release
# A tag like v0.1.0 builds keymoat for macOS and Linux and attaches the binaries and their checksums to a release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/keymoat-${target%/*}-${target#*/}" .
          done
          cd dist && sha256sum keymoat-* > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "keymoat ${GITHUB_REF_NAME#v}" --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
